name: Deploy Frontend to Vercel

on:
  push:
    branches: [release]
    paths:
      - 'apps/frontend/**'

jobs:
  deploy-ui:
    name: Build and Push UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable Corepack for pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel Environment Information
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify Vercel Build Output
        run: test -f apps/frontend/.vercel/output/static/index.html && find apps/frontend/.vercel/output/static -maxdepth 2 -type f | sort

      - name: Deploy Project Artifacts to Vercel
        run: |
          deployment_output=$(npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/frontend)
          printf '%s\n' "${deployment_output}"
          deployment_url=$(printf '%s\n' "${deployment_output}" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n 1)
          echo "Vercel deployment URL: ${deployment_url}"
          test -n "${deployment_url}"
          response_code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "${deployment_url}")
          echo "Vercel response status: ${response_code}"
          test "${response_code}" != 404
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
