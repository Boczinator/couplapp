name: Build and Deploy Backend to Coolify

on:
  release:
    types: [published] # Triggers strictly when you publish a new GitHub Release

env:
  REGISTRY: ghcr.io
  # Converts your repository name to lowercase automatically (required by Docker)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build Docker Image & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Grants permission to upload packages to GHCR securely

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Handled automatically by GitHub

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: . # Keeps the entire monorepo as the build context for Turbo
          file: ./apps/backend/Dockerfile # ◄ Points to your clean subfolder path
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha # Leverages fast GitHub caching layers
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Coolify Webhook
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Ping Coolify Deploy Webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_BEARER_TOKEN }}
        run: |
          curl -X POST \
               -H "Authorization: Bearer $COOLIFY_TOKEN" \
               "$COOLIFY_WEBHOOK"
