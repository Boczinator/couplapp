name: Build and Deploy Backend to Coolify

on:
  release:
    types: [published] # Triggers strictly when you publish a new GitHub Release

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build Docker Image & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Grants permission to upload packages to GHCR securely

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Handled automatically by GitHub

      - name: Downcase Repository Name
        run: |
          # Forces the image name to lowercase to prevent GHCR syntax failures
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=release
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: . # Keeps the entire monorepo as the build context for Turbo
          file: ./apps/backend/Dockerfile # Points to your clean subfolder path
          push: true
          tags: ${{ steps.meta.outputs.tags }} # Automatically applies tag format (e.g., :v1.0.0 and :latest)
          cache-from: type=gha # Leverages fast GitHub caching layers
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Coolify Webhook
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Ping Coolify Deploy Webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          # Webhook URLs contain token signatures; headers are excluded to avoid rejection
          curl -X POST "$COOLIFY_WEBHOOK"
