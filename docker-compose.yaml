#     build: ./frontend
#     ports:
#       - "3000:3000" # Exposes React to your browser
#     volumes:
#       - ./frontend:/app # Allows hot-reloading during development

#   backend:
#     build: ./backend
#     ports:
#       - "3000:3000" # Exposes NestJS API (Use a different port if 3000 is taken, e.g., 8000)
#     volumes:
#       - ./backend:/app
#     environment:
#       - DB_HOST=db # Matches the service name below
services:
  db:
    image: postgres:17
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_PASSWORD: foobar1234
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready']
      interval: 1s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    volumes:
      - ./data:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: always

volumes:
  redis_data:
  postgres_data:
