services:
  db:
    image: postgres:17
    restart: always
    ports:
      - "5432:5432" # Exposes PostgreSQL to your host machine
    environment:
      POSTGRES_PASSWORD: foobar1234
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 10
 